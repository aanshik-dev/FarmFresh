<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#0B1220"/>

  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#F1F5F9">Membership &amp; Crop-Deal Flow</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#8FA3BF">From registration to an active — or rejected — deal</text>

  <rect x="330" y="88" width="340" height="42" rx="21" fill="#10B981"/>
  <text x="500" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#06281C">START — Farmer registers a deal</text>

  <line x1="500" y1="130" x2="500" y2="154" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="180" y="154" width="640" height="84" rx="10" fill="#131C2E" stroke="#26334D"/>
  <text x="196" y="178" font-size="14" font-weight="700" fill="#38BDF8">Collective reviews the deal</text>
  <text x="196" y="202" font-size="13" fill="#C7D4E6">Members vote · 48-hour auto-approve</text>
  <text x="196" y="222" font-size="13" fill="#C7D4E6">Registration closes OPEN queries (10-day cooldown)</text>

  <line x1="500" y1="238" x2="500" y2="272" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="350" y="272" width="300" height="44" rx="22" fill="#F59E0B"/>
  <text x="500" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2204">DECISION</text>

  <line x1="167" y1="316" x2="167" y2="344" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="500" y1="316" x2="500" y2="344" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="833" y1="316" x2="833" y2="344" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="17" y="344" width="300" height="130" rx="10" fill="#131C2E" stroke="#10B981"/>
  <text x="33" y="370" font-size="15" font-weight="700" fill="#34D399">ACCEPT</text>
  <text x="33" y="396" font-size="13" fill="#C7D4E6">Deal → ACTIVE</text>
  <text x="33" y="418" font-size="13" fill="#C7D4E6">30-day lock</text>
  <text x="33" y="440" font-size="13" fill="#C7D4E6">Farmer + members notified</text>

  <rect x="350" y="344" width="300" height="130" rx="10" fill="#131C2E" stroke="#FB7185"/>
  <text x="366" y="370" font-size="15" font-weight="700" fill="#F87171">REJECT</text>
  <text x="366" y="396" font-size="13" fill="#C7D4E6">Deal → REJECTED</text>
  <text x="366" y="418" font-size="13" fill="#C7D4E6">Farmer can re-register</text>

  <rect x="683" y="344" width="300" height="130" rx="10" fill="#131C2E" stroke="#FBBF24"/>
  <text x="699" y="370" font-size="15" font-weight="700" fill="#FBBF24">CANCEL</text>
  <text x="699" y="396" font-size="13" fill="#C7D4E6">Deal → CANCELLED</text>
  <text x="699" y="418" font-size="13" fill="#C7D4E6">No lock applied</text>

  <rect x="30" y="500" width="940" height="100" rx="10" fill="#131C2E" stroke="#26334D"/>
  <text x="46" y="526" font-size="14" font-weight="700" fill="#38BDF8">Why it matters</text>
  <text x="46" y="550" font-size="13" fill="#C7D4E6">Every decision is logged in status-history · farmers can re-register after a reject.</text>
</svg>
