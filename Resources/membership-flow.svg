<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1010" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FBBF24"/>
    </marker>
  </defs>
  <rect width="1000" height="1010" fill="#0B1220"/>

  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#F1F5F9">Membership &amp; Crop-Deal Flow</text>
  <text x="500" y="66" text-anchor="middle" font-size="13" fill="#8FA3BF">Farmer Group requests to supply a Collective — crop-by-crop negotiation</text>

  <!-- START -->
  <rect x="300" y="90" width="400" height="46" rx="23" fill="#10B981" opacity="0.92"/>
  <text x="500" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#06281C">START — Farmer Group logs in (FARMER_GROUP role)</text>

  <line x1="500" y1="136" x2="500" y2="160" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- REQUEST CALL -->
  <rect x="200" y="160" width="600" height="56" rx="10" fill="#131C2E" stroke="#26334D"/>
  <text x="500" y="184" text-anchor="middle" font-size="13.5" font-weight="700" fill="#38BDF8">POST /farmer/me/members/request</text>
  <text x="500" y="204" text-anchor="middle" font-size="12.5" fill="#C7D4E6">{ collectiveId, cropCodes: [...] } — one deal per requested crop</text>

  <line x1="500" y1="216" x2="500" y2="240" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- VALIDATION -->
  <rect x="200" y="240" width="600" height="86" rx="10" fill="#131C2E" stroke="#26334D"/>
  <text x="216" y="264" font-size="13" font-weight="700" fill="#38BDF8">Validation gate (general.service → membership.service)</text>
  <text x="216" y="286" font-size="12.5" fill="#C7D4E6">• Profile must be complete — name · phone · address district/state/pinCode · coordinates</text>
  <text x="216" y="306" font-size="12.5" fill="#C7D4E6">• Collective must be ACTIVE · requested crops must overlap its CollectedCrops demand list</text>

  <line x1="500" y1="326" x2="500" y2="350" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- TRANSACTION -->
  <rect x="200" y="350" width="600" height="108" rx="10" fill="#131C2E" stroke="#10B981"/>
  <text x="216" y="374" font-size="13" font-weight="700" fill="#34D399">Mongoose transaction (session)</text>
  <text x="216" y="396" font-size="12.5" fill="#C7D4E6">• Membership created or reused → status PENDING</text>
  <text x="216" y="416" font-size="12.5" fill="#C7D4E6">• One CropDeal per crop → status REQUESTED · demandedPrice captured</text>
  <text x="216" y="436" font-size="12.5" fill="#C7D4E6">• Collective notified — Notification doc + badge count</text>

  <line x1="500" y1="458" x2="500" y2="492" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arrA)"/>

  <!-- DECISION -->
  <rect x="330" y="492" width="340" height="54" rx="27" fill="#F59E0B" opacity="0.92"/>
  <text x="500" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2204">COLLECTIVE'S DECISION</text>

  <line x1="185" y1="546" x2="185" y2="580" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arrA)"/>
  <line x1="500" y1="546" x2="500" y2="580" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arrA)"/>
  <line x1="815" y1="546" x2="815" y2="580" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arrA)"/>

  <text x="185" y="568" text-anchor="middle" font-size="12" font-weight="700" fill="#FBBF24">ACCEPT</text>
  <text x="500" y="568" text-anchor="middle" font-size="12" font-weight="700" fill="#FBBF24">REJECT</text>
  <text x="815" y="568" text-anchor="middle" font-size="12" font-weight="700" fill="#FBBF24">CANCEL</text>

  <!-- ACCEPT -->
  <rect x="40" y="580" width="290" height="180" rx="10" fill="#131C2E" stroke="#10B981"/>
  <text x="56" y="604" font-size="12.5" font-weight="700" fill="#34D399">ACCEPT · POST /collective/me/members/accept</text>
  <text x="56" y="628" font-size="12" fill="#C7D4E6">• Bulk-approve chosen deals:</text>
  <text x="66" y="646" font-size="12" fill="#C7D4E6">agreedPrice + approvalDate</text>
  <text x="56" y="666" font-size="12" fill="#C7D4E6">• Reject the rest (rejectionReason)</text>
  <text x="56" y="686" font-size="12" fill="#C7D4E6">• Membership → ACTIVE · zone assigned</text>
  <text x="56" y="706" font-size="12" fill="#C7D4E6">• route · distance (Haversine km) · estTime</text>
  <text x="56" y="726" font-size="12" fill="#C7D4E6">• Farmer notified → deals APPROVED</text>

  <!-- REJECT -->
  <rect x="355" y="580" width="290" height="180" rx="10" fill="#131C2E" stroke="#FB7185"/>
  <text x="371" y="604" font-size="12.5" font-weight="700" fill="#F87171">REJECT · POST /collective/me/members/reject</text>
  <text x="371" y="628" font-size="12" fill="#C7D4E6">• All REQUESTED deals → REJECTED</text>
  <text x="371" y="648" font-size="12" fill="#C7D4E6">• Membership → REJECTED</text>
  <text x="371" y="668" font-size="12" fill="#C7D4E6">• Farmer notified with reason</text>
  <text x="371" y="696" font-size="12" fill="#8FA3BF">The farmer may request the</text>
  <text x="371" y="714" font-size="12" fill="#8FA3BF">same collective again later.</text>

  <!-- CANCEL -->
  <rect x="670" y="580" width="290" height="180" rx="10" fill="#131C2E" stroke="#38BDF8"/>
  <text x="686" y="604" font-size="12.5" font-weight="700" fill="#38BDF8">CANCEL · POST /farmer/me/members/cancel</text>
  <text x="686" y="628" font-size="12" fill="#C7D4E6">• Farmer withdraws own REQUESTED</text>
  <text x="696" y="646" font-size="12" fill="#C7D4E6">deals → CANCELLED</text>
  <text x="686" y="666" font-size="12" fill="#C7D4E6">• Membership left PENDING / cleaned</text>
  <text x="686" y="686" font-size="12" fill="#C7D4E6">• Collective notified</text>

  <line x1="185" y1="760" x2="185" y2="800" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="500" y1="760" x2="500" y2="800" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="815" y1="760" x2="815" y2="800" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- END STATES -->
  <rect x="40" y="800" width="290" height="54" rx="27" fill="#10B981" opacity="0.9"/>
  <text x="185" y="823" text-anchor="middle" font-size="12.5" font-weight="700" fill="#06281C">ACTIVE → pickups · payments</text>
  <text x="185" y="842" text-anchor="middle" font-size="11.5" fill="#0B3D2C">· reviews · announcements</text>

  <rect x="355" y="800" width="290" height="54" rx="27" fill="#FB7185" opacity="0.85"/>
  <text x="500" y="823" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3B0D18">REJECTED</text>
  <text x="500" y="842" text-anchor="middle" font-size="11.5" fill="#5C1A28">may request again later</text>

  <rect x="670" y="800" width="290" height="54" rx="27" fill="#38BDF8" opacity="0.85"/>
  <text x="815" y="823" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A2335">CANCELLED</text>
  <text x="815" y="842" text-anchor="middle" font-size="11.5" fill="#123C5C">no obligations · can retry</text>

  <!-- NOTE -->
  <rect x="40" y="884" width="920" height="98" rx="10" fill="#131C2E" stroke="#26334D"/>
  <text x="56" y="910" font-size="13" font-weight="700" fill="#38BDF8">What happens after approval</text>
  <text x="56" y="934" font-size="12.5" fill="#C7D4E6">Approved deals feed the pickup engine: farmer marks crop READY → collective creates schedule (zone + driver + date) → collection → payment.</text>
  <text x="56" y="956" font-size="12.5" fill="#C7D4E6">Every transition is timestamped (approvalDate · status-history · pickup-history) and broadcast as a notification to the other side.</text>
</svg>
