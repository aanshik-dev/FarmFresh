<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
  </defs>
  <rect width="1000" height="860" fill="#0B1220"/>

  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#F1F5F9">Payment &amp; Ledger Flow</text>
  <text x="500" y="66" text-anchor="middle" font-size="13" fill="#8FA3BF">Prompt, proof-backed settlement after every completed pickup</text>

  <!-- PRECONDITION -->
  <rect x="200" y="90" width="600" height="96" rx="10" fill="#131C2E" stroke="#10B981"/>
  <text x="216" y="114" font-size="13" font-weight="700" fill="#34D399">After a COMPLETED schedule (auto-accrued in the same transaction)</text>
  <text x="216" y="136" font-size="12.5" fill="#C7D4E6">• Membership.balance += amount owed (what the collective owes this farmer)</text>
  <text x="216" y="156" font-size="12.5" fill="#C7D4E6">• FarmerGroup.pendingBalance += · totalPickups += 1</text>
  <text x="216" y="176" font-size="12.5" fill="#C7D4E6">• Each deal's paymentStatus → PENDING</text>

  <line x1="500" y1="186" x2="500" y2="212" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- COLLECTIVE INSPECTS -->
  <rect x="200" y="212" width="600" height="58" rx="10" fill="#131C2E" stroke="#26334D"/>
  <text x="500" y="236" text-anchor="middle" font-size="13.5" font-weight="700" fill="#38BDF8">Collective inspects the money</text>
  <text x="500" y="256" text-anchor="middle" font-size="12.5" fill="#C7D4E6">GET /me/pickup-dashboard (unpaid schedules · pending payout) · GET /me/farmers/:id/ledger (balance · earnings · receipts)</text>

  <line x1="500" y1="270" x2="500" y2="296" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- PAY ACTION -->
  <rect x="200" y="296" width="600" height="96" rx="10" fill="#131C2E" stroke="#26334D"/>
  <text x="500" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#38BDF8">POST /collective/me/schedules/:scheduleId/farmers/:farmerGroupId/pay</text>
  <text x="500" y="342" text-anchor="middle" font-size="12.5" fill="#C7D4E6">method: UPI · BANK_TRANSFER · CASH · CHEQUE · OTHER</text>
  <text x="500" y="362" text-anchor="middle" font-size="12.5" fill="#C7D4E6">paymentProof upload is MANDATORY (image/PDF · 5 MB) · optional UTR number · remarks · item selection</text>

  <line x1="500" y1="392" x2="500" y2="418" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- TRANSACTION -->
  <rect x="200" y="418" width="600" height="128" rx="10" fill="#131C2E" stroke="#10B981"/>
  <text x="216" y="442" font-size="13" font-weight="700" fill="#34D399">Mongoose transaction — full audit trail</text>
  <text x="216" y="464" font-size="12.5" fill="#C7D4E6">• PaymentTransaction created — PM1000000 code · balanceAfter ledger proof</text>
  <text x="216" y="484" font-size="12.5" fill="#C7D4E6">• ScheduleItems → PAID · paymentProof · paidAt · receipt URL</text>
  <text x="216" y="504" font-size="12.5" fill="#C7D4E6">• Membership.balance −= amount · FarmerGroup.totalEarnings +=</text>
  <text x="216" y="524" font-size="12.5" fill="#C7D4E6">• FarmerGroup.pendingBalance −= · Schedule.paidAmount += · deals → PAID / PARTIAL</text>
  <text x="216" y="544" font-size="12.5" fill="#C7D4E6">• Farmer notified — receipt visible instantly</text>

  <line x1="500" y1="546" x2="500" y2="572" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- FARMER SIDE -->
  <rect x="200" y="572" width="600" height="58" rx="10" fill="#131C2E" stroke="#26334D"/>
  <text x="500" y="596" text-anchor="middle" font-size="13.5" font-weight="700" fill="#38BDF8">Farmer verifies</text>
  <text x="500" y="616" text-anchor="middle" font-size="12.5" fill="#C7D4E6">GET /me/balance — per-collective balances + last 50 receipts · pickup detail shows proof images</text>

  <line x1="500" y1="630" x2="500" y2="660" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- END -->
  <rect x="265" y="660" width="470" height="50" rx="25" fill="#10B981" opacity="0.92"/>
  <text x="500" y="691" text-anchor="middle" font-size="14" font-weight="700" fill="#06281C">Money settles — transparent &amp; fully auditable</text>

  <!-- NOTE -->
  <rect x="40" y="736" width="920" height="92" rx="10" fill="#131C2E" stroke="#26334D"/>
  <text x="56" y="760" font-size="13" font-weight="700" fill="#38BDF8">Ledger integrity</text>
  <text x="56" y="782" font-size="12.5" fill="#C7D4E6">• markItemPaid = single-item variant of the same transaction</text>
  <text x="56" y="802" font-size="12.5" fill="#C7D4E6">• isFullyPaid computed from paidAmount vs totalAmount per schedule</text>
  <text x="56" y="822" font-size="12.5" fill="#C7D4E6">• Proofs stored in Cloudinary (Farmfresh/payments, overwrite disabled) · every line links its PaymentTransaction</text>
</svg>
