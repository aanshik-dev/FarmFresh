<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#0B1220"/>

  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#F1F5F9">Pickup Scheduling &amp; Collection Flow</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#8FA3BF">From "crop is READY" to a completed collection run</text>

  <rect x="330" y="88" width="340" height="42" rx="21" fill="#10B981"/>
  <text x="500" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#06281C">START — Crop marked READY</text>

  <line x1="500" y1="130" x2="500" y2="154" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="180" y="154" width="640" height="84" rx="10" fill="#131C2E" stroke="#26334D"/>
  <text x="196" y="178" font-size="14" font-weight="700" fill="#38BDF8">Farmer updates crop stage</text>
  <text x="196" y="202" font-size="13" fill="#C7D4E6">Stage + photos + message</text>
  <text x="196" y="222" font-size="13" fill="#C7D4E6">POST /farmer/me/deals/:dealId/update-status</text>

  <line x1="500" y1="238" x2="500" y2="272" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="180" y="272" width="640" height="84" rx="10" fill="#131C2E" stroke="#26334D"/>
  <text x="196" y="296" font-size="14" font-weight="700" fill="#38BDF8">Collective schedules pickup</text>
  <text x="196" y="320" font-size="13" fill="#C7D4E6">createSchedule — zone, capacity, no double-booking</text>
  <text x="196" y="340" font-size="13" fill="#C7D4E6">Farmers + driver notified</text>

  <line x1="500" y1="356" x2="500" y2="392" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="320" y="392" width="360" height="44" rx="22" fill="#F59E0B"/>
  <text x="500" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2204">SCHEDULE LIFECYCLE</text>

  <line x1="130" y1="436" x2="130" y2="464" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="395" y1="436" x2="395" y2="464" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="660" y1="436" x2="660" y2="464" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="870" y1="436" x2="870" y2="464" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="25" y="464" width="210" height="130" rx="10" fill="#131C2E" stroke="#38BDF8"/>
  <text x="41" y="490" font-size="15" font-weight="700" fill="#38BDF8">START</text>
  <text x="41" y="516" font-size="13" fill="#C7D4E6">IN_PROGRESS</text>
  <text x="41" y="538" font-size="13" fill="#C7D4E6">Driver ONROUTE</text>
  <text x="41" y="560" font-size="13" fill="#C7D4E6">Farmers alerted</text>

  <rect x="290" y="464" width="210" height="130" rx="10" fill="#131C2E" stroke="#10B981"/>
  <text x="306" y="490" font-size="15" font-weight="700" fill="#34D399">COMPLETE</text>
  <text x="306" y="516" font-size="13" fill="#C7D4E6">Qty corrections</text>
  <text x="306" y="538" font-size="13" fill="#C7D4E6">Stock + balances update</text>
  <text x="306" y="560" font-size="13" fill="#C7D4E6">Locks released</text>

  <rect x="555" y="464" width="210" height="130" rx="10" fill="#131C2E" stroke="#FBBF24"/>
  <text x="571" y="490" font-size="15" font-weight="700" fill="#FBBF24">POSTPONE</text>
  <text x="571" y="516" font-size="13" fill="#C7D4E6">→ POSTPONED</text>
  <text x="571" y="538" font-size="13" fill="#C7D4E6">Re-editable later</text>

  <rect x="820" y="464" width="210" height="130" rx="10" fill="#131C2E" stroke="#FB7185"/>
  <text x="836" y="490" font-size="15" font-weight="700" fill="#F87171">CANCEL</text>
  <text x="836" y="516" font-size="13" fill="#C7D4E6">Items cancelled</text>
  <text x="836" y="538" font-size="13" fill="#C7D4E6">Locks released</text>
  <text x="836" y="560" font-size="13" fill="#C7D4E6">Driver freed</text>

  <line x1="395" y1="594" x2="395" y2="622" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="265" y="622" width="470" height="44" rx="22" fill="#10B981"/>
  <text x="500" y="650" text-anchor="middle" font-size="14" font-weight="700" fill="#06281C">COMPLETED → payment flow</text>
</svg>
